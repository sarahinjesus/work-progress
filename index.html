<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<title>대외협력 업무 트래커</title>
<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
  :root{
    --navy-950:#0a1226;
    --navy-900:#0f1c3a;
    --navy-800:#16264d;
    --navy-700:#1f3766;
    --navy-600:#2c4a85;
    --navy-100:#e7ecf7;
    --accent:#4f7cff;
    --accent-dark:#3a5fd6;
    --gray:#8b93a7;
    --gray-light:#f4f5f8;
    --border:#e3e6ee;
    --green:#1f9d55;
    --green-bg:#e7f8ee;
    --blue:#2c63e0;
    --blue-bg:#e8eefc;
    --amber:#b98305;
    --amber-bg:#fbf1dc;
    --orange:#ef8b2c;
    --red:#d0342c;
    --red-bg:#fbe7e6;
    --text:#1b2436;
    --text-sub:#5b647a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    font-family:"Gowun Dodum","맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--gray-light);
    color:var(--text);
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#c7cede;border-radius:6px;}

  /* ---------- 헤더 ---------- */
  .topbar{
    background:var(--navy-900);color:#fff;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .topbar .title-area{display:flex;flex-direction:column;gap:2px;}
  .topbar .title-area .brand{font-size:12px;letter-spacing:.08em;color:#9fb0dd;font-weight:600;}
  .topbar .title-area h1{margin:0;font-size:20px;font-weight:700;color:#fff;}
  .topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:transform .05s ease, background .15s ease;white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);}
  .btn-ghost:hover{background:rgba(255,255,255,.16);}
  .btn-outline{background:#fff;color:var(--navy-800);border:1px solid var(--border);}
  .btn-outline:hover{background:var(--gray-light);}
  .btn-sm{padding:7px 13px;font-size:13px;}

  /* ---------- 동기화 표시 ---------- */
  .sync{font-size:12px;font-weight:700;padding:6px 12px 6px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .sync-ok{color:#7fe0b0;background:rgba(31,157,85,.16);}
  .sync-saving{color:#ffdf8a;background:rgba(185,131,5,.22);}
  .sync-local{color:#ffb3ae;background:rgba(208,52,44,.18);}
  .acct{font-size:12px;color:#c7d2ea;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- 탭 ---------- */
  .tabbar{background:var(--navy-800);padding:0 28px;display:flex;gap:4px;border-bottom:1px solid var(--navy-700);}
  .tab{padding:13px 18px;color:#b6c1de;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;user-select:none;}
  .tab:hover{color:#fff;}
  .tab.active{color:#fff;border-bottom-color:var(--accent);}
  .tab .count{display:inline-block;margin-left:6px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:10px;font-size:11.5px;}
  .tab.active .count{background:var(--accent);}

  /* ---------- 본문 ---------- */
  .content{max-width:1500px;margin:0 auto;padding:24px 28px 80px;}

  /* ---------- 카테고리 추가 바 ---------- */
  .catbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .catbar input{
    flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  .catbar input:focus{outline:none;border-color:var(--accent);}

  /* ---------- 상태 필터 ---------- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--text-sub);cursor:pointer;}
  .chip:hover{border-color:var(--navy-600);}
  .chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

  /* ---------- 카테고리 카드 ---------- */
  .cat-card{background:#fff;border:1px solid rgba(20,38,77,.08);border-radius:14px;padding:16px 18px 12px;margin-bottom:16px;box-shadow:0 3px 12px rgba(10,18,38,.08);}
  .cat-swatches{display:flex;gap:6px;align-items:center;margin:0 2px 12px;flex-wrap:wrap;}
  .swatch-label{font-size:11.5px;font-weight:700;color:var(--text-sub);margin-right:3px;}
  .swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.16);cursor:pointer;padding:0;transition:transform .08s ease;}
  .swatch:hover{transform:scale(1.14);}
  .swatch.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy-700);}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cat-name{
    font-size:16px;font-weight:800;color:var(--navy-800);border:1px solid transparent;background:transparent;
    padding:5px 8px;border-radius:8px;font-family:inherit;flex:1;min-width:0;
  }
  .cat-name:hover{background:var(--gray-light);}
  .cat-name:focus{outline:none;background:#fff;border-color:var(--accent);}
  .cat-count{font-size:12px;font-weight:700;color:var(--text-sub);background:var(--gray-light);padding:3px 10px;border-radius:12px;white-space:nowrap;}
  .cat-del{background:transparent;border:none;color:var(--gray);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;}
  .cat-del:hover{background:var(--red-bg);color:var(--red);}
  .cat-move{display:flex;flex-direction:column;gap:1px;align-items:center;flex-shrink:0;}
  .cat-move button{background:transparent;border:none;color:#b7bece;font-size:11px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px;}
  .cat-move button:hover{background:var(--gray-light);color:var(--navy-700);}

  /* ---------- 진행률 막대 ---------- */
  .cat-progress{margin:0 2px 12px;}
  .cat-prog-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:5px;}
  .cat-prog-track{height:9px;background:var(--gray-light);border-radius:6px;overflow:hidden;}
  .cat-prog-fill{height:100%;border-radius:6px;transition:width .35s ease, background-color .25s ease;min-width:0;}
  .p-red{background:var(--red);}
  .p-orange{background:var(--orange);}
  .p-blue{background:var(--blue);}
  .p-green{background:var(--green);}

  /* ---------- 상단 필터 바 ---------- */
  .viewbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
  .viewbar .chips{margin-bottom:0;}
  .cat-filter{padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);cursor:pointer;min-width:210px;font-weight:600;}
  .cat-filter:focus{outline:none;border-color:var(--accent);}

  /* ---------- Mission Complete ---------- */
  .mission-hero{background:linear-gradient(135deg,#123f27,#1f9d55);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:22px;}
  .mission-hero .m-title{font-size:20px;font-weight:800;letter-spacing:.01em;}
  .mission-hero .m-sub{font-size:13px;color:#c7f0d7;margin-top:4px;}
  .cat-card.done-cat{border-color:#bfe6cd;background:#fbfefc;}
  .cat-name-static{font-size:16px;font-weight:800;color:var(--navy-800);flex:1;min-width:0;padding:5px 2px;}
  .done-badge{font-size:11.5px;font-weight:800;color:var(--green);background:var(--green-bg);padding:3px 10px;border-radius:12px;white-space:nowrap;}

  /* ---------- 카테고리 병렬 배치 + 카드 안 스크롤 ---------- */
  #catContainer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;}
  #catContainer .empty{grid-column:1/-1;}
  @media (max-width:1080px){ #catContainer{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .cat-card{display:flex;flex-direction:column;}
  .task-scroll{max-height:290px;overflow-y:auto;margin:0 -6px;padding:0 6px;}
  .task-scroll::-webkit-scrollbar{width:7px;}
  .task-scroll::-webkit-scrollbar-thumb{background:#d3d9e6;border-radius:5px;}

  /* ---------- 하위 카테고리 ---------- */
  .subcat{background:rgba(255,255,255,.5);border-radius:10px;padding:2px 10px;margin-bottom:8px;transition:box-shadow .12s ease, background .12s ease;}
  .subcat.drop-hover{background:rgba(79,124,255,.14);box-shadow:0 0 0 2px var(--accent) inset;}
  .subcat-head{display:flex;align-items:center;gap:8px;padding:7px 2px;cursor:pointer;user-select:none;}
  .subcat-toggle{color:var(--navy-600);font-size:11px;width:13px;text-align:center;flex-shrink:0;}
  .subcat-name{font-size:13.5px;font-weight:800;color:var(--navy-700);border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;flex:1;min-width:0;font-family:inherit;}
  .subcat-name:hover{background:var(--gray-light);}
  .subcat-name:focus{outline:none;background:#fff;border-color:var(--accent);}
  .subcat-name-static{font-size:13.5px;font-weight:800;color:var(--navy-700);flex:1;padding:3px 5px;}
  .subcat-count{font-size:11px;font-weight:700;color:var(--text-sub);background:var(--gray-light);padding:1px 8px;border-radius:10px;flex-shrink:0;}
  .sub-del{color:#aeb6c6;font-size:15px;background:none;border:none;cursor:pointer;flex-shrink:0;line-height:1;padding:2px 5px;border-radius:6px;}
  .sub-del:hover{background:var(--red-bg);color:var(--red);}
  .subcat.collapsed .subcat-body{display:none;}
  .subcat-empty{color:#b7bece;font-size:12px;padding:6px 4px 8px;}
  .sub-add{display:block;width:100%;margin:6px 0 4px;padding:6px 8px;border:1px dashed var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--text);background:transparent;}
  .sub-add::placeholder{color:var(--accent);opacity:.75;}
  .sub-add:focus{outline:none;background:#fff;border-style:solid;border-color:var(--accent);}
  .subcat-addbar{display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--border);}
  .subcat-addbar input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--gray-light);color:var(--text);}
  .subcat-addbar input:focus{outline:none;background:#fff;border-color:var(--accent);}
  .subcat-addbar .add-sub-btn{background:var(--navy-800);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .row-drag{cursor:grab;color:#c2c8d6;font-size:14px;flex-shrink:0;padding:0 2px;}
  .row-drag:hover{color:var(--navy-600);}
  .trow.dragging{opacity:.4;}

  /* ---------- 업무 행 ---------- */
  .trow{padding:9px 0;border-top:1px solid var(--gray-light);}
  .trow:first-of-type{border-top:none;}
  .trow-title{display:flex;align-items:center;gap:6px;}
  .trow-meta{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:2px;}
  .trow.done .row-title{text-decoration:line-through;color:var(--gray);}
  .row-move{display:flex;flex-direction:column;gap:1px;align-items:center;flex-shrink:0;}
  .row-move button{background:transparent;border:none;color:#b7bece;font-size:9px;line-height:1.05;cursor:pointer;padding:1px 2px;border-radius:4px;}
  .row-move button:hover{background:var(--gray-light);color:var(--navy-700);}
  .row-status{padding:6px 7px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;background:#fff;color:var(--text);cursor:pointer;font-family:inherit;flex-shrink:0;}
  .row-status.s-예정{color:var(--gray);}
  .row-status.s-진행중{color:var(--blue);border-color:#b9ccf5;background:var(--blue-bg);}
  .row-status.s-완료{color:var(--green);border-color:#aee3c4;background:var(--green-bg);}
  .row-title{flex:1;min-width:0;padding:6px 8px;border:1px solid transparent;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;color:var(--text);background:transparent;}
  .row-title:hover{background:var(--gray-light);}
  .row-title:focus{outline:none;background:#fff;border-color:var(--accent);}
  .row-date{font-size:12.5px;font-weight:800;color:var(--navy-800);white-space:nowrap;cursor:pointer;flex-shrink:0;padding:3px 5px;border-radius:6px;margin-left:auto;}
  .row-date:hover{background:var(--gray-light);}
  .row-date.overdue{color:var(--red);}
  .row-date.no-date{color:#c2c8d6;font-weight:700;}
  .row-date-input{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--accent);border-radius:6px;padding:3px 5px;color:var(--text);}
  .row-del{background:transparent;border:none;color:#c2c8d6;font-size:17px;cursor:pointer;border-radius:6px;line-height:1;padding:2px 4px;flex-shrink:0;}
  .row-del:hover{background:var(--red-bg);color:var(--red);}
  .row-memo{display:block;width:100%;margin-top:5px;padding:3px 8px 3px 26px;border:1px solid transparent;border-radius:8px;font-size:12.5px;color:#4a5266;background:transparent;font-family:inherit;}
  .row-memo::placeholder{color:#c2c8d6;}
  .row-memo:hover{background:var(--gray-light);}
  .row-memo:focus{outline:none;background:#fff;border-color:var(--accent);color:var(--text);}

  /* ---------- 업무 추가 행 ---------- */
  .add-row{margin-top:10px;padding-top:12px;border-top:1px dashed var(--border);}
  .add-r1{display:flex;gap:8px;}
  .add-r2{display:flex;gap:8px;margin-top:8px;}
  .add-row .add-title{flex:1;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:var(--gray-light);}
  .add-row .add-title:focus{outline:none;background:#fff;border-color:var(--accent);}
  .add-row .add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .add-row .add-btn:hover{background:var(--accent-dark);}
  .add-row .add-status{padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:700;background:#fff;color:var(--text-sub);font-family:inherit;cursor:pointer;}
  .add-row .add-due{flex:1;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text-sub);background:#fff;}

  .cat-empty{color:var(--gray);font-size:13px;padding:10px 4px 4px;}

  /* ---------- 오늘의 할일 ---------- */
  .today-hero{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;border-radius:14px;
    padding:20px 22px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .today-hero .date{font-size:13px;color:#b6c1de;font-weight:600;}
  .today-hero .msg{font-size:19px;font-weight:800;margin-top:2px;}
  .today-hero .stat{background:rgba(255,255,255,.12);padding:8px 18px;border-radius:10px;font-size:13px;font-weight:700;}
  .today-list{display:flex;flex-direction:column;gap:10px;}
  .tcard{background:#fff;border:1px solid var(--border);border-left:4px solid var(--navy-600);border-radius:10px;padding:13px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .tcard.s-완료{border-left-color:var(--green);opacity:.7;}
  .tcard.s-진행중{border-left-color:var(--blue);}
  .tcard.overdue{border-left-color:var(--red);}
  .tcard .proj-tag{font-size:11.5px;font-weight:700;color:var(--navy-700);background:var(--navy-100);padding:2px 9px;border-radius:6px;}
  .tcard .tc-title{flex:1;min-width:120px;font-size:14.5px;font-weight:700;color:var(--text);}
  .tcard.s-완료 .tc-title{text-decoration:line-through;color:var(--text-sub);}
  .tcard .row-status{margin-left:auto;}
  .tcard .tc-date{font-size:12.5px;font-weight:800;color:var(--navy-800);white-space:nowrap;}
  .today-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .today-bar button{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--navy-800);cursor:pointer;font-family:inherit;}
  .today-bar button:hover{background:var(--gray-light);}
  .today-bar input[type=date]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
  .today-bar .td-reset{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
  .today-section-title{font-size:14px;font-weight:800;color:var(--navy-800);margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}
  .today-section-title .n{font-size:12px;color:var(--text-sub);font-weight:700;}

  .empty{text-align:center;padding:48px 20px;color:var(--gray);background:#fff;border:1px dashed var(--border);border-radius:12px;font-size:14px;line-height:1.7;}

  /* ---------- 확인창 / 토스트 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,18,38,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:400px;padding:24px;}
  .modal h3{margin:0 0 14px;font-size:17px;color:var(--navy-900);}
  .modal p{margin:0 0 22px;font-size:14.5px;line-height:1.6;color:var(--text);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}
  .toast-wrap{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:var(--navy-900);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 28px rgba(10,18,38,.28);opacity:0;transform:translateY(8px);transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
  #fileImportInput{display:none;}

  /* ---------- 카테고리 확대 보기 ---------- */
  #confirmOverlay{z-index:400;}
  .cat-expand{background:transparent;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1;}
  .cat-expand:hover{background:var(--navy-100);color:var(--navy-700);}
  #catFocus{position:fixed;inset:0;background:rgba(10,18,38,.6);display:none;z-index:200;padding:20px;overflow-y:auto;}
  #catFocus.show{display:block;}
  .focus-panel{width:100%;max-width:840px;margin:0 auto;}
  .focus-bar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  #catFocusClose{background:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;color:var(--navy-800);cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(10,18,38,.2);}
  #catFocusClose:hover{background:var(--gray-light);}
  .cat-card.focus{margin-bottom:0;box-shadow:0 24px 70px rgba(10,18,38,.4);}
  .cat-card.focus .cat-name{font-size:20px;}
  .cat-card.focus .row-title{font-size:15px;}
  .cat-card.focus .task-scroll{max-height:calc(100vh - 300px);}

  @media (max-width:620px){
    .topbar,.tabbar,.content{padding-left:16px;padding-right:16px;}
    #catContainer{grid-template-columns:1fr;}
  }
</style>

<div id="app-root"></div>

<script id="app-data" type="application/json">{"v":2,"categories":[],"tasks":[]}</script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script id="app-script">
(function(){
  "use strict";

  /* ===== id ===== */
  function cid(){ return "c" + Date.now().toString(16) + Math.random().toString(16).slice(2,6); }
  function tid(){ return "t" + Date.now().toString(16) + Math.random().toString(16).slice(2,6); }
  function sid(){ return "s" + Date.now().toString(16) + Math.random().toString(16).slice(2,6); }

  /* ===== 날짜 ===== */
  function todayStr(){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(s){ if(!s) return "마감일 없음"; var p=s.split("-"); return p[0]+"년 "+parseInt(p[1],10)+"월 "+parseInt(p[2],10)+"일"; }
  function fmtMD(s){ if(!s) return ""; var p=s.split("-"); return p[1]+"."+p[2]; }
  function shiftDate(dstr, delta){ var p=dstr.split("-"); var dt=new Date(+p[0],+p[1]-1,+p[2]); dt.setDate(dt.getDate()+delta); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
  function setStatus(t, s){ t.status=s; if(s==="완료"){ if(!t.completedOn) t.completedOn=todayStr(); } else { if(t.completedOn) delete t.completedOn; } }
  function isOverdue(t){ return t.due && t.due < todayStr() && t.status!=="완료"; }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  /* ===== 저장 / 게시 ===== */

  function normalize(p){
    if(!p) return {categories:[], tasks:[]};
    if(Array.isArray(p)){
      var cats=[], map={}, tasks=[];
      p.forEach(function(t){
        var name=(t.project&&String(t.project).trim())||"미분류";
        if(!map[name]){ var id=cid(); map[name]=id; cats.push({id:id,name:name}); }
        tasks.push({id:t.id||tid(),catId:map[name],title:t.title||"",due:t.due||"",status:STATUSES.indexOf(t.status)>=0?t.status:"예정",memo:t.memo||"",createdAt:t.createdAt||Date.now()});
      });
      return {categories:cats, tasks:tasks};
    }
    return {categories:Array.isArray(p.categories)?p.categories:[], tasks:Array.isArray(p.tasks)?p.tasks:[]};
  }
  function loadData(){
    var emb=null, loc=null;
    try{ emb=JSON.parse(getSrc("app-data")||"null"); }catch(e){}
    try{ loc=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"); }catch(e){}
    var e=normalize(emb);
    embeddedEmptyOnLoad = !(e.categories.length || e.tasks.length);
    if(e.categories.length||e.tasks.length){ data=e; }
    else { data=normalize(loc); }
    ensureOrder();
  }

    if(state==="ok"){ el.textContent="클라우드 저장됨"; el.className="sync sync-ok"; }
    else if(state==="saving"){ el.textContent="저장 중..."; el.className="sync sync-saving"; }
    else { el.textContent="로그인해야 동기화"; el.className="sync sync-local"; }

  function saveLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }
  function scheduleSave(){
    saveLocal();

    else { setSync("local"); }
  }
  function pushRemote(){
    if(!dataRef){ return; }

  /* ===== 조회 ===== */
  function fullCatTasks(catId){
    return data.tasks.filter(function(t){ return t.catId===catId; })
      .sort(function(a,b){
        var ca=a.status==="완료"?1:0, cb=b.status==="완료"?1:0;
        if(ca!==cb) return ca-cb;
        return (a.order||0)-(b.order||0);
      });
  }
  function moveCategory(id, dir){
    var i=-1; for(var k=0;k<data.categories.length;k++){ if(data.categories[k].id===id){ i=k; break; } }
    var j=i+dir; if(i<0||j<0||j>=data.categories.length) return;
    var tmp=data.categories[i]; data.categories[i]=data.categories[j]; data.categories[j]=tmp;
    scheduleSave(); render();
  }
  function progressClass(pct){ return pct<30?"p-red":(pct<50?"p-orange":(pct<70?"p-blue":"p-green")); }
  function catStats(id){
    var total=0, done=0;
    data.tasks.forEach(function(t){ if(t.catId===id){ total++; if(t.status==="완료") done++; } });
    return {total:total, done:done, pct:total?Math.round(done/total*100):0, complete:(total>0 && done===total)};
  }
  function tasksOf(catId){
    return fullCatTasks(catId).filter(function(t){ return currentStatusFilter==="전체"||t.status===currentStatusFilter; });
  }
  function ensureOrder(){
    var maxByCat={};
    data.tasks.forEach(function(t){
      if(typeof t.order==="number"){ var m=maxByCat[t.catId]; maxByCat[t.catId]=(m==null?t.order:Math.max(m,t.order)); }
    });
    data.tasks.forEach(function(t){
      if(typeof t.order!=="number"){ var m=maxByCat[t.catId]; var n=(m==null?-1:m)+1; t.order=n; maxByCat[t.catId]=n; }
    });
  }
  function moveTask(id, dir){
    var t=findTask(id); if(!t) return;
    var list=fullCatTasks(t.catId);
    var i=-1; for(var k=0;k<list.length;k++){ if(list[k].id===id){ i=k; break; } }
    var j=i+dir; if(i<0||j<0||j>=list.length) return;
    var tmp=list[i].order; list[i].order=list[j].order; list[j].order=tmp;
    scheduleSave(); render();
  }
  function catName(id){ var c=data.categories.find(function(x){return x.id===id;}); return c?c.name:"미분류"; }

    var opts=STATUSES.map(function(s){ return '<option value="'+s+'"'+(s===value?' selected':'')+'>'+s+'</option>'; }).join("");

    h+=statusSelectHtml("row-status", t.status).replace("<select ", '<select data-task="'+t.id+'" ');
    h+=(t.due ? '<span class="row-date'+(over?' overdue':'')+'" data-task="'+t.id+'" title="'+escapeHtml(t.due)+'">'+fmtMD(t.due)+'</span>' : '<span class="row-date no-date" data-task="'+t.id+'">＋날짜</span>');

  function deleteSub(catId, subId){
    var cat=data.categories.find(function(c){return c.id===catId;}); if(!cat) return;
    var n=data.tasks.filter(function(t){return t.catId===catId && (t.subId||"")===subId;}).length;
    showConfirm("이 하위 카테고리를 삭제할까요? 안의 업무 "+n+"건은 기본 그룹으로 옮겨져요.", function(){
      data.tasks.forEach(function(t){ if(t.catId===catId && (t.subId||"")===subId){ delete t.subId; } });
      cat.subs=(cat.subs||[]).filter(function(s){return s.id!==subId;});
      scheduleSave(); render();
    });
  }
  function addTaskToSub(catId, subId, inputEl){
    var title=(inputEl.value||"").trim(); if(!title){ return; }
    var maxo=-1; data.tasks.forEach(function(t){ if(t.catId===catId && typeof t.order==="number" && t.order>maxo) maxo=t.order; });
    var task={id:tid(),catId:catId,title:title,due:"",status:"예정",memo:"",order:maxo+1,createdAt:Date.now()};
    if(subId) task.subId=subId;
    data.tasks.push(task);
    inputEl.value="";
    focusSubAdd={cat:catId, sub:subId||""};
    scheduleSave(); render();
  }
  function moveTaskToSub(taskId, catId, subId){
    var t=findTask(taskId); if(!t) return;
    var sameCat=(!catId || catId===t.catId);
    if(sameCat && (t.subId||"")===(subId||"")) return;
    if(catId && catId!==t.catId) t.catId=catId;
    if(subId) t.subId=subId; else { delete t.subId; }
    var maxo=-1; data.tasks.forEach(function(x){ if(x.catId===t.catId && typeof x.order==="number" && x.order>maxo) maxo=x.order; });
    t.order=maxo+1;
    scheduleSave(); render();
  }
  function toggleCollapse(catId, subId){ var k=catId+"::"+subId; collapsed[k]=!collapsed[k]; render(); }
  function clearDropHovers(){ document.querySelectorAll(".subcat.drop-hover").forEach(function(s){ s.classList.remove("drop-hover"); }); }
  function autoScrollDuringDrag(x,y){
    var el=document.elementFromPoint(x,y);
    var edge=54, sp=18;
    var scroller=el?el.closest(".task-scroll"):null;
    if(scroller && scroller.scrollHeight>scroller.clientHeight+2){
      var r=scroller.getBoundingClientRect();
      if(y<r.top+edge) scroller.scrollTop-=sp;
      else if(y>r.bottom-edge) scroller.scrollTop+=sp;
      return;
    }
    var fo=document.getElementById("catFocus");
    if(fo && fo.classList.contains("show")){
      if(y<edge) fo.scrollTop-=sp; else if(y>window.innerHeight-edge) fo.scrollTop+=sp;
      return;
    }
    if(y<edge) window.scrollBy(0,-sp); else if(y>window.innerHeight-edge) window.scrollBy(0,sp);
  }
  function renderCatFilter(activeCats){
    var sel=document.getElementById("catFilter");
    if(!sel) return;
    var ids=activeCats.map(function(c){return c.id;});

    var opts='<option value="전체">전체 카테고리 보기</option>';
    activeCats.forEach(function(c){ opts+='<option value="'+c.id+'"'+(c.id===selectedCat?' selected':'')+'>'+escapeHtml(c.name)+'</option>'; });
    sel.innerHTML=opts;
    sel.value=selectedCat;
  }
  function renderAll(){
    var c=document.getElementById("catContainer");
    var activeCats=data.categories.filter(function(cat){ return !catStats(cat.id).complete; });

  /* ===== 렌더: 오늘의 할일 ===== */
  function tCard(t, dateShown){
    var over=isOverdue(t);
    var h='<div class="tcard s-'+t.status+(over?' overdue':'')+'" data-task="'+t.id+'">';
    h+='<span class="proj-tag">'+escapeHtml(catName(t.catId))+'</span>';
    h+='<span class="tc-title">'+escapeHtml(t.title)+'</span>';
    if(dateShown){ h+='<span class="tc-date">'+fmtMD(dateShown)+'</span>'; }
    h+=statusSelectHtml("row-status", t.status).replace("<select ", '<select data-task="'+t.id+'" ');
    h+='</div>';
    return h;
  }
  function renderToday(){
    if(!selectedDate) selectedDate=todayStr();
    var d=selectedDate, today=todayStr();
    var di=document.getElementById("todayDate"); if(di) di.value=d;
    document.getElementById("todayDateLabel").textContent=fmtDate(d)+(d===today?" (오늘)":"");
    document.getElementById("countToday").textContent=data.tasks.filter(function(t){return t.due===today;}).length;

    var completed=data.tasks.filter(function(t){ return t.completedOn===d; });
    var due=data.tasks.filter(function(t){ return t.due===d && t.completedOn!==d; });
    var order={"진행중":0,"예정":1,"완료":2};
    due.sort(function(a,b){ return (order[a.status]||9)-(order[b.status]||9); });

    document.getElementById("todayMsg").textContent="완료 "+completed.length+"건 · 마감 "+due.length+"건";
    document.getElementById("todayStat").textContent=(completed.length+due.length)+"건";

    var el=document.getElementById("todayList");
    if(completed.length===0 && due.length===0){
      el.innerHTML='<div class="empty">이 날짜에 해당하는 기록이 없어요.<br>완료한 업무는 완료 처리한 날짜에, 마감 업무는 마감일에 이 날로 모여요.</div>';
      return;
    }
    var html="";
    if(completed.length){
      html+='<div class="today-section-title">이 날 완료한 업무 <span class="n">'+completed.length+'건</span></div>';
      html+='<div class="today-list">';
      completed.forEach(function(t){ html+=tCard(t, t.completedOn); });
      html+='</div>';
    }
    if(due.length){
      html+='<div class="today-section-title">이 날 마감인 업무 <span class="n">'+due.length+'건</span></div>';
      html+='<div class="today-list">';
      due.forEach(function(t){ html+=tCard(t, t.due); });
      html+='</div>';
    }
    el.innerHTML=html;
  }

  /* ===== 렌더: Mission Complete ===== */

        html+='</div>';
        html+='<input class="row-memo" data-task="'+t.id+'" value="'+escapeHtml(t.memo)+'" placeholder="메모 없음">';

  function render(){ renderAll(); renderToday(); renderMission(); renderFocus(); }

  /* ===== 동작 ===== */
  function findTask(id){ return data.tasks.find(function(t){return t.id===id;}); }
  function openDateEditor(id, spanEl){
    var t=findTask(id); if(!t) return;
    var inp=document.createElement("input");
    inp.type="date"; inp.className="row-date-input"; inp.value=t.due||"";
    spanEl.parentNode.replaceChild(inp, spanEl);
    inp.focus();
    if(inp.showPicker){ try{ inp.showPicker(); }catch(e){} }
    var done=false;
    function commit(){ if(done) return; done=true; t.due=inp.value; scheduleSave(); render(); }
    inp.addEventListener("change", commit);
    inp.addEventListener("blur", commit);
  }
  function addCategory(name){
    name=(name||"").trim(); if(!name){ showToast("카테고리 이름을 입력해 주세요"); return; }
    var cat={id:cid(), name:name}; data.categories.push(cat);
    scheduleSave(); focusAddCat=cat.id; render();
  }
  function deleteCategory(id){
    var n=data.tasks.filter(function(t){return t.catId===id;}).length;
    showConfirm("이 카테고리와 그 안의 업무 "+n+"건을 모두 삭제할까요? 되돌릴 수 없습니다.", function(){
      data.categories=data.categories.filter(function(c){return c.id!==id;});
      data.tasks=data.tasks.filter(function(t){return t.catId!==id;});
      scheduleSave(); render();
    });
  }
  function addTask(catId, fromEl){
    var card=fromEl?fromEl.closest('.add-row'):document.querySelector('.add-row[data-cat="'+catId+'"]');
    if(!card) return;
    var titleEl=card.querySelector(".add-title");
    var title=titleEl.value.trim();
    if(!title){ showToast("업무 내용을 입력해 주세요"); titleEl.focus(); return; }
    var due=card.querySelector(".add-due").value;
    var status=card.querySelector(".add-status").value;
    var subSel=card.querySelector(".add-sub-select");
    var subId=subSel?subSel.value:"";
    lastAddSub[catId]=subId;
    var maxo=-1; data.tasks.forEach(function(t){ if(t.catId===catId && typeof t.order==="number" && t.order>maxo) maxo=t.order; });
    var task={id:tid(),catId:catId,title:title,due:due,status:status,memo:"",order:maxo+1,createdAt:Date.now()};
    if(subId) task.subId=subId;
    data.tasks.push(task);
    scheduleSave(); focusAddCat=catId; render();
  }

  var tabBtns;

    currentTab=tab;
    tabBtns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===tab); });
    document.getElementById("view-all").style.display = tab==="all"?"":"none";

  /* ===== Firebase 로그인 / 자동 싱크 ===== */
  function showAccount(user){
    var a=document.getElementById("acctLabel"), b=document.getElementById("btnAuth");
    if(a){ a.textContent=user.email||user.displayName||"로그인됨"; a.style.display=""; }
    if(b){ b.textContent="로그아웃"; }
  }
  function showLoggedOut(){
    var a=document.getElementById("acctLabel"), b=document.getElementById("btnAuth");
    if(a){ a.style.display="none"; }
    if(b){ b.textContent="구글로 로그인"; }
    setSync("local");
  }
  function attachSync(uid){
    if(!fbDb) return;
    if(dataRef){ dataRef.off(); }
    dataRef=fbDb.ref("users/"+uid+"/data");
    dataRef.on("value", function(snap){
      var s=snap.val();
      if(s==null){
        if(data.categories.length || data.tasks.length){ pushRemote(); } else { setSync("ok"); }
        return;
      }
      var incoming;
      try{ incoming=JSON.parse(s); }catch(e){ setSync("ok"); return; }
      var nd=normalize(incoming);
      if(JSON.stringify(nd)===JSON.stringify(data)){ setSync("ok"); return; }
      data=nd; ensureOrder(); saveLocal(); render(); setSync("ok");
    }, function(){ setSync("local"); });
  }
  function signIn(){
    if(typeof firebase==="undefined"){ showToast("인터넷 연결을 확인해 주세요"); return; }
    var provider=new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(function(err){
      var c=err&&err.code;
      if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){
        try{ firebase.auth().signInWithRedirect(provider); }catch(e){}
      } else if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"){
        /* 사용자가 창을 닫음 - 무시 */
      } else { showToast("로그인에 실패했어요. 다시 시도해 주세요"); }
    });
  }
  function signOutNow(){ if(typeof firebase!=="undefined"){ firebase.auth().signOut(); } }
  function initFirebase(){
    if(typeof firebase==="undefined"){ setSync("local"); return; }
    try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){}
    fbDb=firebase.database();
    firebase.auth().getRedirectResult().catch(function(){});
    firebase.auth().onAuthStateChanged(function(user){
      if(user){ currentUid=user.uid; showAccount(user); setSync("saving"); attachSync(user.uid); }
      else { currentUid=null; if(dataRef){ dataRef.off(); dataRef=null; } showLoggedOut(); }
    });
  }

  function init(){
    document.getElementById("app-root").innerHTML=BODY_HTML;
    tabBtns=Array.prototype.slice.call(document.querySelectorAll(".tab"));
    tabBtns.forEach(function(b){ b.addEventListener("click",function(){ switchTab(b.getAttribute("data-tab")); }); });

    /* 상태 필터 */
    document.getElementById("statusChips").addEventListener("click",function(e){
      var chip=e.target.closest(".chip"); if(!chip) return;
      currentStatusFilter=chip.getAttribute("data-status");
      document.querySelectorAll("#statusChips .chip").forEach(function(c){ c.classList.toggle("active", c===chip); });
      renderAll();
    });

    /* 카테고리 선택 드롭다운 */
    document.getElementById("catFilter").addEventListener("change",function(e){ selectedCat=e.target.value; renderAll(); });

    /* 카테고리 추가 */
    var newCat=document.getElementById("newCatInput");
    document.getElementById("btnAddCat").addEventListener("click",function(){ addCategory(newCat.value); newCat.value=""; });
    newCat.addEventListener("keydown",function(e){ if(e.key==="Enter"){ addCategory(newCat.value); newCat.value=""; } });

    /* 카테고리 컨테이너 + 확대 화면 공용 위임 */
    function onCatChange(e){
      var el=e.target;
      if(el.classList.contains("cat-name")){
        var cat=data.categories.find(function(c){return c.id===el.getAttribute("data-cat");});
        if(cat){ cat.name=el.value.trim()||"이름 없음"; scheduleSave(); render(); }
        return;
      }
      if(el.classList.contains("subcat-name")){
        var cat2=data.categories.find(function(c){return c.id===el.getAttribute("data-cat");});
        if(cat2 && cat2.subs){ var sub=cat2.subs.find(function(s){return s.id===el.getAttribute("data-sub");}); if(sub){ sub.name=el.value.trim()||"이름 없음"; scheduleSave(); render(); } }
        return;
      }
      var id=el.getAttribute("data-task"); if(!id) return;
      var t=findTask(id); if(!t) return;
      if(el.classList.contains("row-status")){ setStatus(t, el.value); scheduleSave(); render(); }
      else if(el.classList.contains("row-title")){ t.title=el.value.trim(); scheduleSave(); }
      else if(el.classList.contains("row-memo")){ t.memo=el.value.trim(); scheduleSave(); }
    }
    function onCatClick(e){
      var el=e.target;
      if(el.classList.contains("add-btn")){ addTask(el.getAttribute("data-cat"), el); }
      else if(el.classList.contains("row-date")){ openDateEditor(el.getAttribute("data-task"), el); }
      else if(el.classList.contains("cat-expand")){ openFocus(el.getAttribute("data-cat")); }
      else if(el.classList.contains("mv-up")){ moveTask(el.getAttribute("data-task"), -1); }
      else if(el.classList.contains("mv-down")){ moveTask(el.getAttribute("data-task"), 1); }
      else if(el.classList.contains("cat-mv-up")){ moveCategory(el.getAttribute("data-cat"), -1); }
      else if(el.classList.contains("cat-mv-down")){ moveCategory(el.getAttribute("data-cat"), 1); }
      else if(el.classList.contains("swatch")){
        var sc=data.categories.find(function(c){return c.id===el.getAttribute("data-cat");});
        if(sc){ sc.color=el.getAttribute("data-color"); scheduleSave(); render(); }
      }
      else if(el.classList.contains("cat-del")){ deleteCategory(el.getAttribute("data-cat")); }
      else if(el.classList.contains("row-del")){
        var id=el.getAttribute("data-task");
        showConfirm("이 업무를 삭제할까요? 되돌릴 수 없습니다.", function(){
          data.tasks=data.tasks.filter(function(t){return t.id!==id;}); scheduleSave(); render();
        });
      }
      else if(el.classList.contains("add-sub-btn")){ var inp=el.parentNode.querySelector(".new-sub-input"); addSub(el.getAttribute("data-cat"), inp?inp.value:""); if(inp) inp.value=""; }
      else if(el.classList.contains("sub-del")){ deleteSub(el.getAttribute("data-cat"), el.getAttribute("data-sub")); }
      else {
        var head=el.closest && el.closest(".subcat-head");
        if(head && !el.classList.contains("subcat-name")){ var sc2=head.parentNode; toggleCollapse(sc2.getAttribute("data-cat"), sc2.getAttribute("data-sub")); }
      }
    }
    function onCatKeydown(e){
      if(e.key!=="Enter") return;
      var el=e.target;
      if(el.classList.contains("add-title")){ addTask(el.getAttribute("data-cat"), el); }
      else if(el.classList.contains("new-sub-input")){ addSub(el.getAttribute("data-cat"), el.value); el.value=""; }
    }
    [document.getElementById("catContainer"), document.getElementById("catFocusBody")].forEach(function(container){
      container.addEventListener("change", onCatChange);
      container.addEventListener("click", onCatClick);
      container.addEventListener("keydown", onCatKeydown);
      container.addEventListener("dragstart", function(e){
        var h=e.target.closest&&e.target.closest(".row-drag"); if(!h) return;
        dragTaskId=h.getAttribute("data-task"); e.dataTransfer.effectAllowed="move";
        try{ e.dataTransfer.setData("text/plain", dragTaskId); }catch(_){}
        var row=h.closest(".trow"); if(row) row.classList.add("dragging");
      });
      container.addEventListener("dragover", function(e){
        var sub=e.target.closest&&e.target.closest(".subcat"); if(!sub||!dragTaskId) return;
        e.preventDefault(); if(!sub.classList.contains("drop-hover")){ clearDropHovers(); sub.classList.add("drop-hover"); }
      });
      container.addEventListener("drop", function(e){
        var sub=e.target.closest&&e.target.closest(".subcat"); if(!sub||!dragTaskId) return;
        e.preventDefault(); var tcat=sub.getAttribute("data-cat"), tsub=sub.getAttribute("data-sub"), moving=dragTaskId;
        dragTaskId=null; clearDropHovers(); moveTaskToSub(moving, tcat, tsub);
      });
      container.addEventListener("dragend", function(){ dragTaskId=null; clearDropHovers(); document.querySelectorAll(".trow.dragging").forEach(function(r){r.classList.remove("dragging");}); });
    });
    /* 드래그 중 가장자리에서 자동 스크롤 */
    document.addEventListener("dragover", function(e){ if(!dragTaskId) return; e.preventDefault(); autoScrollDuringDrag(e.clientX, e.clientY); });

    /* 확대 화면 닫기 */
    document.getElementById("catFocusClose").addEventListener("click", closeFocus);
    document.getElementById("catFocus").addEventListener("click", function(e){ if(e.target.id==="catFocus") closeFocus(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape" && focusedCatId) closeFocus(); });

    /* 오늘의 할일: 상태 변경 */
    document.getElementById("todayList").addEventListener("change",function(e){
      var el=e.target; if(!el.classList.contains("row-status")) return;
      var t=findTask(el.getAttribute("data-task")); if(!t) return;
      setStatus(t, el.value); scheduleSave(); render();
    });

    /* 오늘의 할일: 날짜 이동 */
    selectedDate=todayStr();
    document.getElementById("todayPrev").addEventListener("click",function(){ selectedDate=shiftDate(selectedDate||todayStr(),-1); renderToday(); });
    document.getElementById("todayNext").addEventListener("click",function(){ selectedDate=shiftDate(selectedDate||todayStr(),1); renderToday(); });
    document.getElementById("todayReset").addEventListener("click",function(){ selectedDate=todayStr(); renderToday(); });
    document.getElementById("todayDate").addEventListener("change",function(e){ selectedDate=e.target.value||todayStr(); renderToday(); });

    /* Mission Complete: 업무 되돌리기/수정/삭제 */
    var ml=document.getElementById("missionList");
    ml.addEventListener("change",function(e){
      var el=e.target; var id=el.getAttribute("data-task"); if(!id) return;
      var t=findTask(id); if(!t) return;
      if(el.classList.contains("row-status")){ setStatus(t, el.value); scheduleSave(); render(); }
      else if(el.classList.contains("row-title")){ t.title=el.value.trim(); scheduleSave(); }
      else if(el.classList.contains("row-memo")){ t.memo=el.value.trim(); scheduleSave(); }
    });
    ml.addEventListener("click",function(e){
      var el=e.target;
      if(el.classList.contains("row-date")){ openDateEditor(el.getAttribute("data-task"), el); }
      else if(el.classList.contains("row-del")){
        var id=el.getAttribute("data-task");
        showConfirm("이 업무를 삭제할까요? 되돌릴 수 없습니다.", function(){ data.tasks=data.tasks.filter(function(t){return t.id!==id;}); scheduleSave(); render(); });
      } else if(el.classList.contains("cat-del")){ deleteCategory(el.getAttribute("data-cat")); }
    });

    /* 백업 */
    document.getElementById("btnExport").addEventListener("click",doExport);
    var fi=document.getElementById("fileImportInput");
    document.getElementById("btnImport").addEventListener("click",function(){ fi.value=""; fi.click(); });
    fi.addEventListener("change",function(e){ handleImport(e.target.files[0]); });

    document.getElementById("btnAuth").addEventListener("click", function(){ if(currentUid){ signOutNow(); } else { signIn(); } });

    loadData();
    render();
    setSync("local");
    initFirebase();
  }

  /* ===== 백업 ===== */
  function doExport(){
    var out=JSON.stringify(data,null,2);
    var name="업무트래커_백업_"+todayStr().replace(/-/g,"")+".json";
    if(downloadsAPI){
      downloadsAPI.save({filename:name,data:out}).then(function(){ showToast("백업 파일을 저장했어요"); }).catch(function(err){ if(err&&err.code==="declined") return; showToast("백업 저장을 사용할 수 없어요"); });
    }else{
      try{ var b=new Blob([out],{type:"application/json"}); var u=URL.createObjectURL(b); var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }catch(e){ showToast("백업 저장을 사용할 수 없어요"); }
    }
  }
  function handleImport(file){
    if(!file) return;
    var r=new FileReader();
    r.onload=function(ev){
      var parsed;
      try{ parsed=JSON.parse(ev.target.result); }catch(err){ showToast("올바른 백업 파일이 아니에요"); return; }
      var nd=normalize(parsed);
      if(!nd.categories.length && !nd.tasks.length){ showToast("불러올 내용이 없어요"); return; }
      showConfirm("백업을 불러오면 현재 내용을 덮어씁니다. 계속할까요?", function(){
        data=nd; ensureOrder(); scheduleSave(); render(); showToast("백업을 불러왔어요");
      }, "불러오기");
    };
    r.readAsText(file);
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>

</body>
</html>
